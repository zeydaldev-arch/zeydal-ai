 
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ZEYDAL AI Personal - Kişisel yapay zekâ asistanı.">
  <meta name="theme-color" content="#071426">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
  <title>ZEYDAL AI Personal</title>
</head>
<body>

<header>
  <div class="container navbar">
    <a href="./zeydal-ai.html" class="logo">
      ZEYDAL <span>AI PERSONAL</span>
    </a>
  </div>
</header>

<main class="personal-app">

  <!-- GİRİŞ PANELİ -->
  <section id="zeydal-auth-panel">

    <h2>ZEYDAL AI Personal</h2>

    <p class="auth-description">
      Kişisel asistanına erişmek için giriş yap.
    </p>

    <form id="zeydal-login-form" class="auth-form">
      <h3>Giriş Yap</h3>

      <input
        id="zeydal-login-email"
        type="email"
        placeholder="E-posta adresin"
        autocomplete="email"
        required
      >

      <input
        id="zeydal-login-password"
        type="password"
        placeholder="Şifren"
        autocomplete="current-password"
        minlength="12"
        maxlength="128"
        required
      >

      <button type="submit">Giriş Yap</button>
    </form>

    <form id="zeydal-register-form" class="auth-form">
      <h3>Yeni Hesap Oluştur</h3>

      <input
        id="zeydal-register-email"
        type="email"
        placeholder="E-posta adresin"
        autocomplete="email"
        required
      >

      <input
        id="zeydal-register-password"
        type="password"
        placeholder="Şifre (12-128 karakter)"
        autocomplete="new-password"
        minlength="12"
        maxlength="128"
        required
      >

      <button type="submit">Kayıt Ol</button>
    </form>

    <p id="zeydal-auth-message" role="status" aria-live="polite"></p>

  </section>

  <!-- SOHBET AÇMA DÜĞMESİ -->
  <button
    id="zeydal-chat-button"
    type="button"
    aria-label="Sohbeti aç"
    style="display:none;"
  >
    AI
  </button>

  <!-- SOHBET PANELİ -->
  <section
    id="zeydal-chat-panel"
    aria-label="ZEYDAL AI Personal sohbet"
    style="display:none;"
  >

    <div class="chat-header">
      <strong>ZEYDAL AI Personal</strong>

      <div class="chat-header-actions">
        <button id="zeydal-new-chat" type="button">
          Yeni
        </button>

        <button id="zeydal-voice-toggle" type="button">
          🎙️ Sesli Görüşme
        </button>

        <button id="zeydal-logout" type="button">
          Çıkış
        </button>

        <button
          id="zeydal-chat-close"
          type="button"
          aria-label="Sohbeti kapat"
        >
          ✕
        </button>
      </div>
    </div>

    <!-- YEREL AI DURUMU -->
    <div id="zeydal-ai-control">

      <div class="ai-status-header">
        <strong>Yerel Yapay Zekâ</strong>
        <span id="zeydal-ai-indicator">Hazır değil</span>
      </div>

      <p
        id="zeydal-ai-status"
        role="status"
        aria-live="polite"
      >
        Yapay zekâ modeli başlatılmayı bekliyor.
      </p>

      <button
        id="zeydal-ai-start"
        type="button"
      >
        AI'ı Başlat
      </button>

    </div>

    <!-- MESAJLAR -->
    <div
      id="zeydal-chat-messages"
      aria-live="polite"
    ></div>

    <!-- MESAJ GÖNDERME -->
    <form id="zeydal-chat-form">

      <input
        id="zeydal-chat-input"
        type="text"
        placeholder="Önce AI modelinin yüklenmesini bekle..."
        autocomplete="off"
        disabled
        required
      >

      <button
        id="zeydal-chat-send"
        type="submit"
        disabled
      >
        Gönder
      </button>

    </form>

  </section>

</main>

<!-- YEREL AI MOTORU -->
<script src="./local-ai.js"></script>

<script>
(() => {
  "use strict";

  function initializeZeydal() {

    // MEVCUT HESAP API'Sİ
    // Kişisel hesap altyapısı daha sonra ayrılacak.
    const API_URL =
      "https://zeydal-ai-api.zeydal-dev.workers.dev/";

    const SESSION_KEY = "zeydalSessionToken";
    const HISTORY_KEY = "zeydalChatHistory";

    const $ = id => document.getElementById(id);

    const button = $("zeydal-chat-button");
    const panel = $("zeydal-chat-panel");
    const authPanel = $("zeydal-auth-panel");
    const authMessage = $("zeydal-auth-message");

    const messages = $("zeydal-chat-messages");
    const input = $("zeydal-chat-input");
    const sendButton = $("zeydal-chat-send");

    const aiStartButton = $("zeydal-ai-start");
    const aiStatus = $("zeydal-ai-status");
    const aiIndicator = $("zeydal-ai-indicator");

    const requiredElements = [
      button,
      panel,
      authPanel,
      authMessage,
      messages,
      input,
      sendButton,
      aiStartButton,
      aiStatus,
      aiIndicator,
      $("zeydal-chat-form"),
      $("zeydal-chat-close"),
      $("zeydal-new-chat"),
      $("zeydal-logout"),
      $("zeydal-login-form"),
      $("zeydal-register-form"),
      $("zeydal-voice-toggle")
    ];

    if (requiredElements.some(element => !element)) {
      console.error("ZEYDAL AI Personal: HTML öğeleri eksik.");
      return;
    }

    // ESKİ OTURUM ANAHTARINI TAŞI
    let sessionToken =
      localStorage.getItem(SESSION_KEY) || "";

    if (!sessionToken) {
      const oldToken =
        localStorage.getItem("zeydal_ai_session");

      if (oldToken) {
        sessionToken = oldToken;

        localStorage.setItem(
          SESSION_KEY,
          oldToken
        );

        localStorage.removeItem("zeydal_ai_session");
      }
    }

    let history = [];
    let isSending = false;
    let sessionVerified = false;
    let isCheckingSession = false;

    // GEÇMİŞİ YÜKLE
    function loadHistory() {
      try {
        const saved = JSON.parse(
          localStorage.getItem(HISTORY_KEY) || "[]"
        );

        if (Array.isArray(saved)) {
          history = saved.filter(item =>
            item &&
            ["user", "assistant"].includes(item.role) &&
            typeof item.content === "string" &&
            item.content.trim()
          ).slice(-12);
        }

      } catch {
        history = [];
      }
    }

    // GEÇMİŞİ KAYDET
    function saveHistory() {
      try {
        localStorage.setItem(
          HISTORY_KEY,
          JSON.stringify(history.slice(-12))
        );
      } catch (error) {
        console.warn("Sohbet geçmişi kaydedilemedi.");
      }
    }

    // MESAJ GÖSTER
    function addMessage(role, content) {
      const message = document.createElement("div");

      message.className =
        "zeydal-message " +
        (role === "user"
          ? "zeydal-user"
          : "zeydal-assistant");

      const text = document.createElement("p");
      text.textContent = content;

      message.appendChild(text);
      messages.appendChild(message);

      messages.scrollTop = messages.scrollHeight;

      return message;
    }

    // GEÇMİŞİ GÖSTER
    function renderHistory() {
      messages.replaceChildren();

      if (history.length === 0) {
        addMessage(
          "assistant",
          "Merhaba! Ben ZEYDAL AI Personal. Sana nasıl yardımcı olabilirim?"
        );

        return;
      }

      history.forEach(item => {
        addMessage(item.role, item.content);
      });
    }

    // HESAP API İSTEĞİ
    async function apiRequest(
      action,
      data = {},
      authenticated = false
    ) {
      const headers = {
        "Content-Type": "application/json"
      };

      if (authenticated && sessionToken) {
        headers.Authorization =
          `Bearer ${sessionToken}`;
      }

      const response = await fetch(API_URL, {
        method: "POST",
        headers,
        body: JSON.stringify({
          action,
          ...data
        })
      });

      let result;

      try {
        result = await response.json();
      } catch {
        throw new Error(
          "Sunucudan geçerli yanıt alınamadı."
        );
      }

      if (!response.ok || result.success === false) {
        throw new Error(
          result.error ||
          result.message ||
          "İşlem başarısız."
        );
      }

      return result;
    }

    // YEREL AI DURUMU
    function updateAIInterface(status) {
      aiStatus.textContent =
        status.message || "AI durumu kontrol ediliyor.";

      if (status.ready) {
        aiIndicator.textContent = "Çalışıyor";
        aiStartButton.textContent = "AI Hazır";
        aiStartButton.disabled = true;

        input.disabled = false;
        sendButton.disabled = false;

        input.placeholder = "Mesajını yaz...";

        return;
      }

      input.disabled = true;
      sendButton.disabled = true;

      if (status.loading) {
        aiIndicator.textContent = "Yükleniyor";
        aiStartButton.textContent = "AI Yükleniyor...";
        aiStartButton.disabled = false;

        input.placeholder = "AI modeli yükleniyor...";
        return;
      }

      aiIndicator.textContent =
        status.supported === false
          ? "Desteklenmiyor"
          : "Hazır değil";

      aiStartButton.textContent = "AI'ı Başlat";
      aiStartButton.disabled = false;

      input.placeholder = "Önce AI modelini başlat...";
    }

    // OTOMATİK VE MANUEL AI BAŞLATMA
    async function startLocalAI() {
      if (!sessionVerified) return;

      if (!window.ZEYDAL_LOCAL_AI) {
        updateAIInterface({
          ready: false,
          loading: false,
          supported: false,
          message: "Yerel AI motoru bulunamadı."
        });

        return;
      }

      const currentStatus =
        window.ZEYDAL_LOCAL_AI.getStatus();

      updateAIInterface(currentStatus);

      if (currentStatus.ready) return;

      try {
        await window.ZEYDAL_LOCAL_AI.initialize(
          progress => {
            updateAIInterface({
              ready: false,
              loading: true,
              supported: true,
              message:
                progress.text || "Model yükleniyor."
            });
          }
        );

        updateAIInterface(
          window.ZEYDAL_LOCAL_AI.getStatus()
        );

      } catch (error) {
        console.error("Yerel AI başlatma hatası:", error);

        updateAIInterface(
          window.ZEYDAL_LOCAL_AI.getStatus()
        );
      }
    }

    // AI DURUM DEĞİŞİKLİKLERİNİ DİNLE
    window.addEventListener(
      "zeydal:local-ai",
      event => {
        updateAIInterface(event.detail);
      }
    );

    // MANUEL BAŞLATMA
    aiStartButton.addEventListener(
      "click",
      startLocalAI
    );

    // SOHBET GÖNDER
    $("zeydal-chat-form").addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        if (!sessionVerified || isSending) return;

        const ai =
          window.ZEYDAL_LOCAL_AI;

        if (!ai || !ai.getStatus().ready) {
          aiStatus.textContent =
            "Önce yapay zekâ modelini başlatmalısın.";

          return;
        }

        const message = input.value.trim();

        if (!message) return;

        isSending = true;
        sendButton.disabled = true;
        input.disabled = true;

        history.push({
          role: "user",
          content: message
        });

        history = history.slice(-12);
        saveHistory();

        addMessage("user", message);

        input.value = "";

        const waiting = addMessage(
          "assistant",
          "ZEYDAL AI düşünüyor..."
        );

        try {
          const reply = await ai.chat(history);

          waiting.querySelector("p").textContent = reply;

          history.push({
            role: "assistant",
            content: reply
          });

          history = history.slice(-12);
          saveHistory();

        } catch (error) {
          waiting.querySelector("p").textContent =
            "Yanıt oluşturulamadı: " + error.message;

          const lastItem = history[history.length - 1];

          if (
            lastItem &&
            lastItem.role === "user" &&
            lastItem.content === message
          ) {
            history.pop();
          }

          saveHistory();

          console.error("Yerel AI sohbet hatası:", error);

        } finally {
          isSending = false;

          const ready =
            window.ZEYDAL_LOCAL_AI &&
            window.ZEYDAL_LOCAL_AI.getStatus().ready;

          input.disabled = !ready;
          sendButton.disabled = !ready;

          if (ready) input.focus();

          messages.scrollTop = messages.scrollHeight;
        }
      }
    );

    // SOHBETİ AÇ
    function openChat() {
      if (!sessionToken || !sessionVerified) {
        panel.style.display = "none";
        authPanel.style.display = "block";

        authMessage.textContent =
          "Devam etmek için hesabına giriş yapmalısın.";

        return;
      }

      authPanel.style.display = "none";
      panel.style.display = "block";
      button.style.display = "none";

      renderHistory();

      updateAIInterface(
        window.ZEYDAL_LOCAL_AI.getStatus()
      );

      input.focus();
    }

    button.addEventListener("click", openChat);

    // SOHBETİ KAPAT
    $("zeydal-chat-close").addEventListener(
      "click",
      () => {
        panel.style.display = "none";

        if (sessionVerified) {
          button.style.display = "block";
        }
      }
    );

    // YENİ SOHBET
    $("zeydal-new-chat").addEventListener(
      "click",
      () => {
        if (!sessionVerified) return;

        history = [];

        localStorage.removeItem(HISTORY_KEY);

        renderHistory();
        input.focus();
      }
    );

    // GİRİŞ
    $("zeydal-login-form").addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        authMessage.textContent = "Giriş yapılıyor...";

        try {
          const result = await apiRequest("login", {
            email: $("zeydal-login-email").value.trim(),
            password: $("zeydal-login-password").value
          });

          const token =
            result.token ||
            result.sessionToken ||
            result.data?.token;

          if (!token) {
            throw new Error(
              "Sunucu oturum anahtarı döndürmedi."
            );
          }

          sessionToken = token;

          localStorage.setItem(
            SESSION_KEY,
            sessionToken
          );

          sessionVerified = true;

          authMessage.textContent = "Giriş başarılı.";

          openChat();

          // OTOMATİK AI BAŞLATMA
          startLocalAI();

        } catch (error) {
          authMessage.textContent = error.message;
        }
      }
    );

    // KAYIT
    $("zeydal-register-form").addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        authMessage.textContent =
          "Hesap oluşturuluyor...";

        try {
          const result = await apiRequest("register", {
            email: $("zeydal-register-email").value.trim(),
            password: $("zeydal-register-password").value
          });

          authMessage.textContent =
            result.message ||
            "Kayıt tamamlandı. Şimdi giriş yapabilirsin.";

        } catch (error) {
          authMessage.textContent = error.message;
        }
      }
    );

    // OTURUM KONTROLÜ
    async function checkSession() {
      if (isCheckingSession) return;

      isCheckingSession = true;
      sessionVerified = false;

      panel.style.display = "none";
      authPanel.style.display = "none";
      button.style.display = "none";

      if (!sessionToken) {
        authPanel.style.display = "block";

        isCheckingSession = false;
        return;
      }

      authMessage.textContent =
        "Oturum kontrol ediliyor...";

      try {
        const result = await apiRequest(
          "check-session",
          {},
          true
        );

        const isValid =
          result.valid === true ||
          result.authenticated === true ||
          result.data?.valid === true ||
          result.data?.authenticated === true;

        if (!isValid) {
          const isInvalid =
            result.valid === false ||
            result.authenticated === false ||
            result.data?.valid === false ||
            result.data?.authenticated === false;

          if (isInvalid) {
            sessionToken = "";

            localStorage.removeItem(SESSION_KEY);

            authMessage.textContent =
              "Oturum sona ermiş. Tekrar giriş yap.";
          } else {
            authMessage.textContent =
              "Oturum doğrulama yanıtı beklenen biçimde değil.";
          }

          authPanel.style.display = "block";
          return;
        }

        sessionVerified = true;

        authPanel.style.display = "none";
        button.style.display = "block";

        // OTOMATİK AI BAŞLATMA
        startLocalAI();

        console.log("ZEYDAL AI Personal: Oturum doğrulandı.");

      } catch (error) {
        sessionVerified = false;

        authPanel.style.display = "block";

        authMessage.textContent =
          "Oturum doğrulanamadı. İnternet bağlantını kontrol et.";

        console.warn("Oturum kontrol hatası:", error);

      } finally {
        isCheckingSession = false;
      }
    }

    // SESLİ GÖRÜŞME MESAJLARI
    window.addEventListener(
      "zeydal:voice",
      event => {
        const detail = event.detail || {};

        if (detail.type === "user-transcription") {
          addMessage("user", detail.text);

        } else if (detail.type === "assistant-text") {
          addMessage("assistant", detail.text);
        }
      }
    );

    // ÇIKIŞ
    $("zeydal-logout").addEventListener(
      "click",
      async () => {
        $("zeydal-logout").disabled = true;

        try {
          if (sessionToken) {
            await apiRequest("logout", {}, true);
          }
        } catch (error) {
          console.warn("Sunucu çıkış isteği tamamlanamadı:", error);
        } finally {
          sessionToken = "";
          sessionVerified = false;

          localStorage.removeItem(SESSION_KEY);
          localStorage.removeItem("zeydal_ai_session");

          panel.style.display = "none";
          button.style.display = "none";
          authPanel.style.display = "block";

          authMessage.textContent = "Oturum kapatıldı.";

          $("zeydal-logout").disabled = false;
        }
      }
    );

    // BAŞLANGIÇ
    loadHistory();
    checkSession();

    console.log(
      "ZEYDAL AI Personal: Uygulama başlatıldı."
    );
  }

  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded",
      initializeZeydal
    );
  } else {
    initializeZeydal();
  }

})();
</script>

<!-- SESLİ ASİSTAN -->
<script src="./voice.js"></script>

<!-- ÇEVRİMDIŞI ALTYAPI -->
<script src="./offline.js"></script>

</body>
</html>
